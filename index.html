<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LInE Atuadores — Framework de Gestão</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#1E4A5C;--pl:#2a6278;--pd:#143545;--o:#E07A56;--bg:#f2f5f8;--s:#fff;--b:#dde4ea;--t:#1a2e3a;--tm:#5c7080;--ok:#2e8b57;--wn:#b8860b;--cr:#c0392b}
body{font-family:'Raleway',sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
#topbar{background:var(--pd);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#topbar img{height:32px}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-user{font-size:12px;color:rgba(255,255,255,.65)}
.tb-role{font-size:10px;font-weight:700;padding:2px 9px;border-radius:12px;text-transform:uppercase;letter-spacing:.8px}
.role-master{background:#8B4513;color:#fff}
.role-dir{background:var(--o);color:#fff}
.role-ges{background:rgba(255,255,255,.15);color:#fff}
.tb-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Raleway',sans-serif;font-size:12px;font-weight:600;padding:5px 14px;border-radius:5px;cursor:pointer;transition:background .15s}
.tb-btn:hover{background:rgba(255,255,255,.2)}
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pd) 0%,var(--pl) 100%)}
.auth-card{background:#fff;border-radius:14px;padding:36px 40px;width:390px;max-width:94vw;box-shadow:0 12px 48px rgba(0,0,0,.28)}
.auth-logo{text-align:center;margin-bottom:22px}
.auth-logo img{height:42px}
.auth-title{font-size:14px;font-weight:700;color:var(--p);margin-bottom:4px;text-align:center}
.auth-sub{font-size:11px;color:var(--tm);text-align:center;margin-bottom:20px}
.auth-err{background:#fdf0f0;border:1px solid #f5c6cb;color:var(--cr);font-size:12px;padding:8px 12px;border-radius:6px;margin-bottom:10px;display:none}
.auth-err.show{display:block}
.fg{margin-bottom:12px}
.fl{display:block;font-size:10px;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.fi,.fs,.fta{width:100%;font-family:'Raleway',sans-serif;font-size:13px;color:var(--t);background:#f8fafb;border:1.5px solid var(--b);border-radius:6px;padding:8px 11px;outline:none;transition:border .14s}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--p);background:#fff}
.fta{min-height:72px;resize:vertical}
.fi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#shell{display:none;flex-direction:column;min-height:100vh}
#shell.on{display:flex}
#body{display:flex;flex:1;overflow:hidden;height:calc(100vh - 56px)}
#sb{width:232px;background:var(--pd);flex-shrink:0;overflow-y:auto;padding-bottom:16px}
.sb-sec{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.28);letter-spacing:1.4px;text-transform:uppercase;padding:14px 18px 4px}
.ni{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 18px;cursor:pointer;color:rgba(255,255,255,.6);font-size:12.5px;border-left:2px solid transparent;transition:all .14s;user-select:none}
.ni:hover{background:rgba(255,255,255,.06);color:#fff}
.ni.active{background:rgba(224,122,86,.17);color:#fff;border-left-color:var(--o);font-weight:700}
.ni.sub{padding-left:28px;font-size:12px}
.ni.sub2{padding-left:42px;font-size:11.5px;color:rgba(255,255,255,.42)}
.ni.sub2:hover,.ni.sub2.active{color:#fff}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;color:#fff}
.chv{font-size:10px;margin-left:auto;opacity:.4;transition:transform .2s}
.chv.open{transform:rotate(90deg)}
#main{flex:1;overflow-y:auto;padding:24px 28px;min-width:0}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.ph-title{font-size:18px;font-weight:800;color:var(--p)}
.ph-sub{font-size:12px;color:var(--tm);margin-top:3px}
.ph-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:'Raleway',sans-serif;font-size:12px;font-weight:700;padding:7px 16px;border-radius:6px;cursor:pointer;border:1.5px solid var(--b);background:var(--s);color:var(--t);transition:all .15s}
.btn:hover{border-color:var(--p);color:var(--p)}
.btn.primary{background:var(--p);color:#fff;border-color:var(--p)}
.btn.primary:hover{background:var(--pl)}
.btn.orange{background:var(--o);color:#fff;border-color:var(--o)}
.btn.sm{font-size:11px;padding:5px 11px}
.btn.danger{color:var(--cr);border-color:#f0bcbc}
.btn.danger:hover{background:#fdf0f0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mxg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.mx{background:var(--s);border-radius:8px;border:1px solid var(--b);padding:13px 15px}
.mx-l{font-size:10px;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}
.mx-v{font-size:22px;font-weight:800;color:var(--p)}
.mx-s{font-size:10px;color:var(--tm);margin-top:2px}
.mx.ac .mx-v{color:var(--o)}
.sec{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--tm);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--b)}
.tbl{overflow-x:auto;border-radius:8px;border:1px solid var(--b);margin-bottom:14px;background:var(--s)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{text-align:left;padding:9px 13px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tm);background:#f8fafc;border-bottom:1px solid var(--b)}
tbody td{padding:9px 13px;border-bottom:1px solid var(--b);color:var(--t);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f8fafc}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.tok{background:#d4edda;color:#155724}
.tat{background:#fff3cd;color:#856404}
.tcr{background:#f8d7da;color:#721c24}
.tco{background:#e0e7ef;color:#1E4A5C}
.tnd{background:#f0f0f0;color:#555}
.pbw{background:var(--b);border-radius:20px;height:5px;margin-top:5px;min-width:60px;overflow:hidden}
.pbb{height:100%;border-radius:20px;background:var(--p);transition:width .3s}
.pbb.g{background:var(--ok)}
.pbb.o{background:var(--o)}
.pbb.r{background:var(--cr)}
.card{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.mc{border:1px solid var(--b);border-radius:8px;padding:13px 15px;margin-bottom:8px;background:var(--s)}
.mc-name{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:8px}
.mc-il{font-size:9.5px;color:var(--tm);text-transform:uppercase;letter-spacing:.5px}
.mc-iv{font-size:15px;font-weight:800;margin-top:2px}
.up{color:var(--ok)}
.dw{color:var(--cr)}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:18px;vertical-align:middle}
.spark span{width:4px;border-radius:1px;background:var(--p);display:inline-block}
.score{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.sh{background:#d4edda;color:#155724}
.sm{background:#fff3cd;color:#856404}
.sl{background:#f8d7da;color:#721c24}
.ci{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--b)}
.ci:last-child{border-bottom:none}
.ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--b);flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;transition:all .15s}
.ck.done{background:var(--ok);border-color:var(--ok);color:#fff}
.ck.pend{border-color:var(--o)}
.ct{flex:1;font-size:12px;line-height:1.5}
.ct.dt{text-decoration:line-through;color:var(--tm)}
.cd{font-size:10px;color:var(--tm);white-space:nowrap}
.tv-dir{margin-bottom:20px}
.tv-dir-hd{font-size:12px;font-weight:700;color:#fff;padding:7px 16px;border-radius:6px;display:inline-block;margin-bottom:10px}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px;padding-left:16px}
.tvc{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:10px 12px;border-top:2px solid var(--o);cursor:pointer;transition:box-shadow .14s}
.tvc:hover{box-shadow:0 2px 12px rgba(30,74,92,.12)}
.tvc-name{font-size:12px;font-weight:700;margin-bottom:5px}
.tvc-row{font-size:11px;color:var(--tm);margin-bottom:2px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-bg.hide{display:none}
.modal{background:#fff;border-radius:10px;padding:24px 28px;width:480px;max-width:100%;box-shadow:0 16px 48px rgba(0,0,0,.22);max-height:90vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:800;color:var(--p);margin-bottom:16px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.loading{text-align:center;padding:48px;color:var(--tm)}
.spinner{width:28px;height:28px;border:3px solid var(--b);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:28px;color:var(--tm);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#toast{position:fixed;bottom:24px;right:24px;background:var(--p);color:#fff;font-size:12px;font-weight:600;padding:10px 18px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:300;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}
@media(max-width:860px){.mxg{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}#sb{width:190px}}
@media(max-width:600px){#sb{display:none}#main{padding:16px}.mxg{grid-template-columns:repeat(2,1fr)}.fi-row{grid-template-columns:1fr}}
</style>
</head>

<script>
const SB = supabase.createClient('https://zxzafqmeqyfoymeaaeua.supabase.co', 'sb_publishable_VGDULb7F6fZJdoboar0Yng_2dyBZLQ5');
const SB_ADMIN = supabase.createClient('https://zxzafqmeqyfoymeaaeua.supabase.co', 'sb_secret_qeS16vm6N53J9K7MEpBv3Q_DuGOn2fm', {auth:{autoRefreshToken:false,persistSession:false}});

let ST = {user:null, perfil:null, gestores:[], diretorias:[], view:'overview', ctxGestor:null};

async function init() {
  const {data:{session}} = await SB.auth.getSession();
  if (session) await afterLogin(session.user);
}

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;
  if (!email || !pass) return showErr('Preencha e-mail e senha.');
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Entrando...';
  const {data, error} = await SB.auth.signInWithPassword({email, password:pass});
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error) return showErr('E-mail ou senha incorretos.');
  await afterLogin(data.user);
}

async function afterLogin(user) {
  ST.user = user;
  await new Promise(r => setTimeout(r, 600));
  const {data:perfil} = await SB.from('perfis').select('*').eq('id', user.id).single();
  ST.perfil = perfil;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('shell').classList.add('on');
  document.getElementById('tb-user').textContent = perfil?.nome || user.email;
  const badge = document.getElementById('tb-role');
  const roleMap = {master:'Master', diretoria:'Diretoria', gestor:'Gestor'};
  const classMap = {master:'role-master', diretoria:'role-dir', gestor:'role-ges'};
  const role = perfil?.role || 'gestor';
  badge.textContent = roleMap[role] || 'Gestor';
  badge.className = 'tb-role ' + (classMap[role] || 'role-ges');
  await loadAll();
}

async function doLogout() {
  await SB.auth.signOut();
  ST = {user:null,perfil:null,gestores:[],diretorias:[],view:'overview',ctxGestor:null};
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('shell').classList.remove('on');
  document.getElementById('l-pass').value = '';
}

function showErr(msg) {
  const e = document.getElementById('auth-err');
  e.textContent = msg; e.classList.add('show');
}

document.getElementById('l-pass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

async function loadAll() {
  const role = ST.perfil?.role;
  const {data:dirs} = await SB.from('diretorias').select('*').order('nome');
  ST.diretorias = dirs || [];
  if (role === 'master' || role === 'diretoria') {
    const {data:gs} = await SB.from('perfis').select('*').eq('role','gestor').order('nome');
    ST.gestores = gs || [];
  }
  buildSidebar();
  go('overview');
}

function buildSidebar() {
  const role = ST.perfil?.role;
  const extra = document.getElementById('sb-extra');
  extra.innerHTML = '';
  if (role === 'master') {
    extra.innerHTML += '<div class="sb-sec">Administração</div>';
    extra.innerHTML += '<div class="ni sub" id="nav-admin-users" onclick="go('admin-users')">&#9670; Usuários</div>';
    extra.innerHTML += '<div class="ni sub" id="nav-admin-dirs" onclick="go('admin-dirs')">&#9670; Diretorias</div>';
    extra.innerHTML += '<div class="sb-sec">Gestores</div>';
    extra.innerHTML += '<div id="sb-gest-list"></div>';
    buildGestSidebar();
  } else if (role === 'diretoria') {
    extra.innerHTML += '<div class="sb-sec">Minha Diretoria</div>';
    extra.innerHTML += '<div id="sb-gest-list"></div>';
    buildGestSidebar();
  } else {
    extra.innerHTML += '<div class="sb-sec">Minha área</div>';
    extra.innerHTML += '<div class="ni sub" id="nav-metas" onclick="go('metas')">&#9675; Minhas Metas</div>';
    extra.innerHTML += '<div class="ni sub" id="nav-comp" onclick="go('comp')">&#9675; Compromissos</div>';
    extra.innerHTML += '<div class="ni sub" id="nav-proj" onclick="go('proj')">&#9675; Projetos</div>';
  }
}

function buildGestSidebar() {
  const list = document.getElementById('sb-gest-list');
  if (!list) return;
  const role = ST.perfil?.role;
  const cores = ['#1E4A5C','#E07A56','#2e8b57','#8B4513','#6B3FA0'];
  list.innerHTML = '';

  if (role === 'master') {
    // Agrupa por diretoria
    ST.diretorias.forEach(function(dir) {
      const gs = ST.gestores.filter(function(g) { return g.diretoria_id === dir.id; });
      if (!gs.length) return;
      const sec = document.createElement('div');
      sec.style.cssText = 'font-size:9px;font-weight:700;color:rgba(255,255,255,.2);letter-spacing:1px;text-transform:uppercase;padding:8px 18px 2px';
      sec.textContent = dir.nome;
      list.appendChild(sec);
      gs.forEach(function(g, i) {
        const d = document.createElement('div');
        d.className = 'ni sub2'; d.id = 'nav-g-' + g.id;
        d.innerHTML = '<div class="av" style="background:' + (cores[i%cores.length]) + '">' + ini(g.nome) + '</div> ' + g.nome;
        d.onclick = function() { go('gestor', g.id); };
        list.appendChild(d);
      });
    });
    // Sem diretoria
    const semDir = ST.gestores.filter(function(g) { return !g.diretoria_id; });
    if (semDir.length) {
      const sec = document.createElement('div');
      sec.style.cssText = 'font-size:9px;font-weight:700;color:rgba(255,255,255,.2);letter-spacing:1px;text-transform:uppercase;padding:8px 18px 2px';
      sec.textContent = 'Sem diretoria';
      list.appendChild(sec);
      semDir.forEach(function(g, i) {
        const d = document.createElement('div');
        d.className = 'ni sub2'; d.id = 'nav-g-' + g.id;
        d.innerHTML = '<div class="av" style="background:' + (cores[i%cores.length]) + '">' + ini(g.nome) + '</div> ' + g.nome;
        d.onclick = function() { go('gestor', g.id); };
        list.appendChild(d);
      });
    }
  } else {
    // Diretoria: só vê seus gestores
    const minhaDir = ST.perfil?.diretoria_id;
    const meus = ST.gestores.filter(function(g) { return g.diretoria_id === minhaDir; });
    meus.forEach(function(g, i) {
      const d = document.createElement('div');
      d.className = 'ni sub'; d.id = 'nav-g-' + g.id;
      d.innerHTML = '<div class="av" style="background:' + (cores[i%cores.length]) + '">' + ini(g.nome) + '</div> ' + g.nome;
      d.onclick = function() { go('gestor', g.id); };
      list.appendChild(d);
    });
  }
}

function ini(n) { return n.split(' ').map(function(p){return p[0];}).join('').substr(0,2).toUpperCase(); }

function go(view, param) {
  ST.view = view; ST.ctxGestor = param || null;
  document.querySelectorAll('.ni').forEach(function(n) { n.classList.remove('active'); });
  const navId = param ? 'nav-g-' + param : 'nav-' + view;
  const nav = document.getElementById(navId);
  if (nav) nav.classList.add('active');
  else { const ov = document.getElementById('nav-ov'); if(ov) ov.classList.add('active'); }
  render();
}

async function render() {
  setMain('<div class="loading"><div class="spinner"></div>Carregando...</div>');
  const v = ST.view;
  const role = ST.perfil?.role;
  if (v === 'overview') {
    if (role === 'master' || role === 'diretoria') await vOverview();
    else await vMeuPainel();
  } else if (v === 'gestor') await vGestor(ST.ctxGestor);
  else if (v === 'metas') await vMeuMetas();
  else if (v === 'comp') await vMeuComp();
  else if (v === 'proj') await vMeuProj();
  else if (v === 'admin-users') await vAdminUsers();
  else if (v === 'admin-dirs') await vAdminDirs();
}

function setMain(html) { document.getElementById('main').innerHTML = html; }

/* UTILS */
function tagH(s) {
  const m = {ok:'<span class="tag tok">No prazo</span>',at:'<span class="tag tat">Atenção</span>',cr:'<span class="tag tcr">Crítico</span>',co:'<span class="tag tco">Concluído</span>',nd:'<span class="tag tnd">Não iniciado</span>'};
  return m[s] || '';
}
function pbH(p, s) {
  const cl = s==='co'?'g':s==='cr'?'r':s==='at'?'o':'';
  return '<div class="pbw"><div class="pbb ' + cl + '" style="width:' + Math.min(p,100) + '%"></div></div>';
}
function sparkH(arr) {
  if (!arr || !arr.length) return '—';
  const a = typeof arr === 'string' ? JSON.parse(arr) : arr;
  if (!a.length) return '—';
  const mx = Math.max.apply(null, a);
  return '<span class="spark">' + a.map(function(v) { return '<span style="height:' + (Math.round(v/mx*14)+2) + 'px"></span>'; }).join('') + '</span>';
}
function perf(metas) {
  if (!metas.length) return 0;
  return Math.round(metas.reduce(function(a,m) {
    const p = m.invertida ? (m.valor_meta/m.valor_atual)*100 : (m.valor_atual/m.valor_meta)*100;
    return a + Math.min(p||0,100);
  }, 0) / metas.length);
}
function scoreH(p) {
  const c = p>=90?'sh':p>=70?'sm':'sl';
  return '<div class="score ' + c + '">' + p + '%</div>';
}
function varH(m) {
  if (!m.valor_atual || !m.valor_meta) return '—';
  const v = m.invertida ? (m.valor_meta/m.valor_atual-1)*100 : (m.valor_atual/m.valor_meta-1)*100;
  return '<span style="color:' + (v>=0?'var(--ok)':'var(--cr)') + ';font-weight:800">' + (v>=0?'+':'') + v.toFixed(1) + '%</span>';
}
function hoje() { return new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}); }
function fmtDate(iso) { if(!iso)return '—'; try{ const p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }catch(e){ return iso; } }
function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2200); }
function cm(id) { document.getElementById(id).classList.add('hide'); }
function om(id) { document.getElementById(id).classList.remove('hide'); }

async function loadGestor(id) {
  const results = await Promise.all([
    SB.from('metas').select('*').eq('gestor_id',id).order('created_at'),
    SB.from('compromissos').select('*').eq('gestor_id',id).order('created_at'),
    SB.from('projetos').select('*').eq('gestor_id',id).order('created_at')
  ]);
  return {metas:results[0].data||[], comp:results[1].data||[], proj:results[2].data||[]};
}

/* VIEW: OVERVIEW (Master / Diretoria) */
async function vOverview() {
  const role = ST.perfil?.role;
  let gestores = ST.gestores;
  if (role === 'diretoria') {
    gestores = gestores.filter(function(g) { return g.diretoria_id === ST.perfil?.diretoria_id; });
  }
  const allData = await Promise.all(gestores.map(function(g) { return loadGestor(g.id); }));
  const totM = allData.reduce(function(a,d){return a+d.metas.length;},0);
  const totP = allData.reduce(function(a,d){return a+d.proj.length;},0);
  const totC = allData.reduce(function(a,d){return a+d.comp.length;},0);
  const cOk = allData.reduce(function(a,d){return a+d.comp.filter(function(c){return c.concluido;}).length;},0);

  // Agrupa por diretoria
  let treeHTML = '';
  const dirs = role === 'diretoria'
    ? ST.diretorias.filter(function(d){ return d.id === ST.perfil?.diretoria_id; })
    : ST.diretorias;

  dirs.forEach(function(dir) {
    const gs = gestores.filter(function(g){ return g.diretoria_id === dir.id; });
    if (!gs.length) return;
    treeHTML += '<div class="tv-dir">';
    treeHTML += '<div class="tv-dir-hd" style="background:' + dir.cor + '">' + dir.nome + '</div>';
    treeHTML += '<div class="tv-grid">';
    gs.forEach(function(g, i) {
      const di = gestores.indexOf(g);
      const d = allData[di] || {metas:[],comp:[],proj:[]};
      const mOk = d.metas.filter(function(m){return m.valor_atual&&m.valor_meta&&(m.invertida?m.valor_meta/m.valor_atual:m.valor_atual/m.valor_meta)>=0.9;}).length;
      const pOk = d.proj.filter(function(p){return p.status==='ok'||p.status==='co';}).length;
      const cok = d.comp.filter(function(c){return c.concluido;}).length;
      treeHTML += '<div class="tvc" onclick="go('gestor','' + g.id + '')" style="border-top-color:' + dir.cor + '">';
      treeHTML += '<div class="tvc-name">' + g.nome + ' <span style="font-size:10px;color:var(--tm);font-weight:400">· ' + (g.area||'—') + '</span></div>';
      treeHTML += '<div class="tvc-row">&#9670; ' + mOk + '/' + d.metas.length + ' metas ≥90%</div>';
      treeHTML += '<div class="tvc-row">&#9670; ' + pOk + '/' + d.proj.length + ' projetos OK</div>';
      treeHTML += '<div class="tvc-row">&#9670; ' + cok + '/' + d.comp.length + ' compromissos</div>';
      treeHTML += '</div>';
    });
    treeHTML += '</div></div>';
  });

  // Sem diretoria (só master vê)
  if (role === 'master') {
    const semDir = gestores.filter(function(g){ return !g.diretoria_id; });
    if (semDir.length) {
      treeHTML += '<div class="tv-dir"><div class="tv-dir-hd" style="background:#888">Sem diretoria</div><div class="tv-grid">';
      semDir.forEach(function(g) {
        const di = gestores.indexOf(g);
        const d = allData[di] || {metas:[],comp:[],proj:[]};
        treeHTML += '<div class="tvc" onclick="go('gestor','' + g.id + '')">';
        treeHTML += '<div class="tvc-name">' + g.nome + '</div>';
        treeHTML += '<div class="tvc-row">' + (g.area||'—') + '</div>';
        treeHTML += '</div>';
      });
      treeHTML += '</div></div>';
    }
  }

  let rows = '';
  gestores.forEach(function(g, i) {
    const d = allData[i] || {metas:[],comp:[],proj:[]};
    const p = perf(d.metas);
    const mOk = d.metas.filter(function(m){return m.valor_atual&&m.valor_meta&&(m.invertida?m.valor_meta/m.valor_atual:m.valor_atual/m.valor_meta)>=0.9;}).length;
    const cok = d.comp.filter(function(c){return c.concluido;}).length;
    const pOk = d.proj.filter(function(j){return j.status==='ok'||j.status==='co';}).length;
    const dir = ST.diretorias.find(function(d){return d.id===g.diretoria_id;});
    rows += '<tr onclick="go('gestor','' + g.id + '')" style="cursor:pointer">';
    rows += '<td><strong>' + g.nome + '</strong><br><span style="font-size:10px;color:var(--tm)">' + (g.area||'—') + '</span></td>';
    if (role === 'master') rows += '<td style="font-size:11px">' + (dir?dir.nome:'—') + '</td>';
    rows += '<td>' + scoreH(p) + '</td><td>' + mOk + '/' + d.metas.length + '</td>';
    rows += '<td>' + cok + '/' + d.comp.length + '</td><td>' + pOk + '/' + d.proj.length + '</td></tr>';
  });

  const thDir = role === 'master' ? '<th>Diretoria</th>' : '';
  setMain(
    '<div class="ph"><div><div class="ph-title">Painel Geral</div><div class="ph-sub">' + hoje() + ' · ' + gestores.length + ' gestores</div></div></div>' +
    '<div class="mxg"><div class="mx"><div class="mx-l">Gestores</div><div class="mx-v">' + gestores.length + '</div></div>' +
    '<div class="mx"><div class="mx-l">Metas</div><div class="mx-v">' + totM + '</div></div>' +
    '<div class="mx ac"><div class="mx-l">Projetos</div><div class="mx-v">' + totP + '</div></div>' +
    '<div class="mx"><div class="mx-l">Compromissos</div><div class="mx-v">' + cOk + '/' + totC + '</div><div class="mx-s">concluídos</div></div></div>' +
    '<div class="sec">Árvore de gestão</div>' + (treeHTML || '<div class="empty">Nenhum gestor cadastrado.</div>') +
    '<div class="sec">Consolidado</div>' +
    '<div class="tbl"><table><thead><tr><th>Gestor</th>' + thDir + '<th>Score</th><th>Metas ≥90%</th><th>Compromissos</th><th>Projetos OK</th></tr></thead>' +
    '<tbody>' + (rows || '<tr><td colspan="6" class="empty">Nenhum gestor.</td></tr>') + '</tbody></table></div>'
  );
}

async function vGestor(id) {
  const g = ST.gestores.find(function(x){return x.id===id;}) || {nome:'Gestor',area:''};
  const {metas, comp, proj} = await loadGestor(id);
  const p = perf(metas);
  const role = ST.perfil?.role;
  const canEdit = role === 'master' || role === 'diretoria';

  let metasH = metas.map(function(m) {
    const pct = Math.min(m.valor_meta ? (m.invertida?m.valor_meta/m.valor_atual:m.valor_atual/m.valor_meta)*100||0 : 0, 100);
    const ok = pct >= 90;
    return '<div class="mc"><div class="mc-name">' + m.nome + ' <span style="font-size:10px;color:var(--tm);font-weight:400">' + (m.unidade||'') + '</span>' +
      (canEdit ? '<div style="display:flex;gap:5px"><button class="btn sm" onclick="openMetaEdit('' + id + '','' + m.id + '')">Editar</button><button class="btn sm danger" onclick="delMeta('' + m.id + '','' + id + '')">✕</button></div>' : '') +

      '<div><div class="mc-il">Realizado</div><div class="mc-iv ' + (ok?'up':'dw') + '">' + (m.valor_atual||'—') + '</div></div>' +
      '<div><div class="mc-il">Vs. meta</div><div class="mc-iv">' + varH(m) + '</div></div>' +
      '<div><div class="mc-il">Evolução</div><div class="mc-iv">' + sparkH(m.historico) + '</div></div>' +
      '</div><div style="font-size:10px;color:var(--tm);margin-bottom:3px">' + Math.round(pct) + '% da meta</div>' +
      pbH(pct, ok?'ok':'at') + '</div>';
  }).join('') || '<div class="empty">Nenhuma meta cadastrada.</div>';

  let compH = comp.map(function(c) {
    return '<div class="ci"><div class="ck ' + (c.concluido?'done':'pend') + '" onclick="toggleComp('' + c.id + '',' + c.concluido + ','' + id + '')">' + (c.concluido?'✓':'') + '</div>' +
      '<div class="ct ' + (c.concluido?'dt':'') + '">' + c.descricao + '</div>' +
      '<div style="display:flex;gap:5px;align-items:center"><div class="cd">' + fmtDate(c.prazo) + '</div>' +
      (canEdit ? '<button class="btn sm danger" onclick="delComp('' + c.id + '','' + id + '')">✕</button>' : '') +
      '</div></div>';
  }).join('') || '<div class="empty">Nenhum compromisso.</div>';

  let projR = proj.map(function(pr) {
    return '<tr><td style="font-weight:700">' + pr.nome + '</td><td>' + tagH(pr.status) + '</td>' +
      '<td style="min-width:90px">' + pr.progresso + '%' + pbH(pr.progresso,pr.status) + '</td>' +
      '<td style="font-size:11px;color:var(--tm)">' + (pr.prazo||'—') + '</td>' +
      (canEdit ? '<td><button class="btn sm" onclick="openProjEdit('' + id + '','' + pr.id + '')">Editar</button> <button class="btn sm danger" onclick="delProj('' + pr.id + '','' + id + '')">✕</button></td>' : '<td></td>') +
      '</tr>';
  }).join('') || '<tr><td colspan="5" class="empty">Nenhum projeto.</td></tr>';

  const btns = canEdit ?
    '<button class="btn sm primary" onclick="openMetaNew('' + id + '')">+ Meta</button>' +
    '<button class="btn sm" onclick="openCompNew('' + id + '')">+ Compromisso</button>' +
    '<button class="btn sm" onclick="openProjNew('' + id + '')">+ Projeto</button>' : '';

  setMain(
    '<div class="ph"><div><div class="ph-title">' + g.nome + '</div><div class="ph-sub">' + (g.area||'—') + ' · ' + hoje() + '</div></div>' +
    '<div class="ph-r">' + scoreH(p) + btns + '</div></div>' +

async function vAdminUsers() {
  const {data:au, error} = await SB_ADMIN.auth.admin.listUsers();
  if (error) { setMain('<div class="empty">Erro ao carregar usuários.</div>'); return; }
  const {data:perfis} = await SB_ADMIN.from('perfis').select('*');
  const pm = {};
  (perfis||[]).forEach(function(p){ pm[p.id]=p; });

  let rows = '';
  au.users.forEach(function(u) {
    const p = pm[u.id] || {};
    const nome = (p.nome||u.email).replace(/'/g,'');
    const dir = ST.diretorias.find(function(d){return d.id===p.diretoria_id;});
    const roleTag = p.role==='master'?'<span class="tag" style="background:#f3e5d8;color:#8B4513">Master</span>':p.role==='diretoria'?'<span class="tag tok">Diretoria</span>':'<span class="tag tnd">Gestor</span>';
    rows += '<tr>';
    rows += '<td><strong>' + (p.nome||u.email) + '</strong><br><span style="font-size:10px;color:var(--tm)">' + u.email + '</span></td>';
    rows += '<td>' + (p.area||'—') + '</td>';
    rows += '<td>' + (dir?dir.nome:'—') + '</td>';
    rows += '<td>' + roleTag + '</td>';
    rows += '<td><div style="display:flex;gap:5px;flex-wrap:wrap">';
    rows += '<button class="btn sm" onclick="editarUsuario('' + u.id + '')">Editar</button>';
    if (p.role !== 'master') rows += '<button class="btn sm danger" onclick="excluirUsuario('' + u.id + '','' + nome + '')">Excluir</button>';
    rows += '</div></td></tr>';
  });

  setMain(
    '<div class="ph"><div><div class="ph-title">Gerenciar Usuários</div><div class="ph-sub">' + au.users.length + ' usuário(s)</div></div>' +
    '<div class="ph-r"><button class="btn primary" onclick="novoUsuario()">+ Novo usuário</button></div></div>' +
    '<div class="tbl"><table><thead><tr><th>Nome</th><th>Área</th><th>Diretoria</th><th>Perfil</th><th>Ações</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="5" class="empty">Nenhum usuário.</td></tr>') +
    '</tbody></table></div>'
  );
}

/* VIEW: ADMIN DIRS */
async function vAdminDirs() {
  let rows = ST.diretorias.map(function(d) {
    return '<tr>' +
      '<td><div style="display:flex;align-items:center;gap:8px"><div style="width:14px;height:14px;border-radius:3px;background:' + d.cor + '"></div><strong>' + d.nome + '</strong></div></td>' +
      '<td style="font-size:11px;color:var(--tm)">' + ST.gestores.filter(function(g){return g.diretoria_id===d.id;}).length + ' gestor(es)</td>' +
      '<td><div style="display:flex;gap:5px">' +
      '<button class="btn sm" onclick="editarDiretoria('' + d.id + '')">Editar</button>' +
      '<button class="btn sm danger" onclick="excluirDiretoria('' + d.id + '','' + d.nome.replace(/'/g,'') + '')">Excluir</button>' +
      '</div></td></tr>';
  }).join('') || '<tr><td colspan="3" class="empty">Nenhuma diretoria cadastrada.</td></tr>';

  setMain(
    '<div class="ph"><div><div class="ph-title">Gerenciar Diretorias</div><div class="ph-sub">' + ST.diretorias.length + ' diretoria(s)</div></div>' +
    '<div class="ph-r"><button class="btn primary" onclick="novaDiretoria()">+ Nova diretoria</button></div></div>' +
    '<div class="tbl"><table><thead><tr><th>Nome</th><th>Gestores</th><th>Ações</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
  );
}

/* CRUD: METAS */
let _mc = {gid:null, mid:null};
function openMetaNew(gid) {
  _mc = {gid,mid:null};
  ['mm-id','mm-nome','mm-unid','mm-meta','mm-atual'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('mm-inv').value = '0';
  document.getElementById('mm-title').textContent = 'Nova Meta';
  om('modal-meta');
}
async function openMetaEdit(gid, mid) {
  _mc = {gid,mid};
  const {data:m} = await SB.from('metas').select('*').eq('id',mid).single();
  if (!m) return;
  document.getElementById('mm-id').value = mid;
  document.getElementById('mm-gid').value = gid;
  document.getElementById('mm-nome').value = m.nome;
  document.getElementById('mm-unid').value = m.unidade||'';
  document.getElementById('mm-meta').value = m.valor_meta||'';
  document.getElementById('mm-atual').value = m.valor_atual||'';
  document.getElementById('mm-inv').value = m.invertida?'1':'0';
  document.getElementById('mm-title').textContent = 'Editar Meta';
  om('modal-meta');
}
async function saveMeta() {
  const {gid,mid} = _mc;
  const nome = document.getElementById('mm-nome').value.trim();
  if (!nome) return alert('Informe o nome.');
  const inv = document.getElementById('mm-inv').value === '1';
  const meta = parseFloat(document.getElementById('mm-meta').value)||0;
  const atual = parseFloat(document.getElementById('mm-atual').value)||0;
  let hist = [];
  if (mid) {
    const {data:old} = await SB.from('metas').select('historico,valor_atual').eq('id',mid).single();
    if (old) {
      hist = old.historico||[];
      if (old.valor_atual && old.valor_atual !== atual) hist = hist.concat([old.valor_atual]).slice(-8);
    }
  }
  const payload = {gestor_id:gid,nome,unidade:document.getElementById('mm-unid').value.trim(),valor_meta:meta,valor_atual:atual,invertida:inv,historico:hist,updated_at:new Date().toISOString()};
  if (mid) await SB.from('metas').update(payload).eq('id',mid);
  else await SB.from('metas').insert(payload);
  cm('modal-meta'); toast('Meta salva!'); render();
}
async function delMeta(mid, gid) {
  if (!confirm('Remover esta meta?')) return;
  await SB.from('metas').delete().eq('id',mid);
  toast('Removido.'); render();
}

/* CRUD: COMPROMISSOS */
let _cc = null;
function openCompNew(gid) {
  _cc = gid;
  document.getElementById('mc-desc').value = '';
  document.getElementById('mc-prazo').value = '';
  document.getElementById('mc-gid').value = gid;
  om('modal-comp');
}
async function saveComp() {
  const desc = document.getElementById('mc-desc').value.trim();
  const gid = document.getElementById('mc-gid').value;
  if (!desc) return alert('Informe a descrição.');
  await SB.from('compromissos').insert({gestor_id:gid,descricao:desc,prazo:document.getElementById('mc-prazo').value||null,concluido:false,semana:new Date().toISOString().split('T')[0]});
  cm('modal-comp'); toast('Compromisso adicionado!'); render();
}
async function toggleComp(id, atual, gid) {
  await SB.from('compromissos').update({concluido:!atual}).eq('id',id);
  toast(atual?'Reaberto.':'Concluído!'); render();
}
async function delComp(id, gid) {
  if (!confirm('Remover?')) return;
  await SB.from('compromissos').delete().eq('id',id);
  toast('Removido.'); render();
}

/* CRUD: PROJETOS */

function openProjNew(gid) {

  ['mp-id','mp-nome','mp-prazo','mp-desc'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('mp-status').value = 'nd';
  document.getElementById('mp-prog').value = '0';
  document.getElementById('mp-gid').value = gid;
  document.getElementById('mp-title').textContent = 'Novo Projeto';
  om('modal-proj');
}
async function openProjEdit(gid, pid) {
  _pc = {gid,pid};
  const {data:pr} = await SB.from('projetos').select('*').eq('id',pid).single();
  if (!pr) return;
  document.getElementById('mp-id').value = pid;
  document.getElementById('mp-gid').value = gid;
  document.getElementById('mp-nome').value = pr.nome;
  document.getElementById('mp-status').value = pr.status;
  document.getElementById('mp-prog').value = pr.progresso;
  document.getElementById('mp-prazo').value = pr.prazo||'';
  document.getElementById('mp-desc').value = pr.descricao||'';
  document.getElementById('mp-title').textContent = 'Editar Projeto';
  om('modal-proj');
}
async function saveProj() {
  const {gid,pid} = _pc;
  const gidFinal = document.getElementById('mp-gid').value || gid;
  const nome = document.getElementById('mp-nome').value.trim();
  if (!nome) return alert('Informe o nome.');
  const payload = {gestor_id:gidFinal,nome,status:document.getElementById('mp-status').value,progresso:parseInt(document.getElementById('mp-prog').value)||0,prazo:document.getElementById('mp-prazo').value.trim()||null,descricao:document.getElementById('mp-desc').value.trim(),updated_at:new Date().toISOString()};
  if (pid) await SB.from('projetos').update(payload).eq('id',pid);
  else await SB.from('projetos').insert(payload);
  cm('modal-proj'); toast('Projeto salvo!'); render();
}
async function delProj(id, gid) {
  if (!confirm('Remover?')) return;
  await SB.from('projetos').delete().eq('id',id);
  toast('Removido.'); render();
}

/* CRUD: USUÁRIOS (Master) */
function toggleDirSelect() {
  const role = document.getElementById('mu-role').value;
  document.getElementById('mu-dir-wrap').style.display = (role === 'gestor' || role === 'diretoria') ? 'block' : 'none';
}
function populateDirSelect(selectedId) {
  const sel = document.getElementById('mu-dir');
  sel.innerHTML = '<option value="">— Sem diretoria —</option>';
  ST.diretorias.forEach(function(d) {
    sel.innerHTML += '<option value="' + d.id + '"' + (d.id===selectedId?' selected':'') + '>' + d.nome + '</option>';
  });
}
function novoUsuario() {
  ['mu-id','mu-nome','mu-area','mu-email','mu-senha'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('mu-role').value = 'gestor';
  document.getElementById('mu-email').disabled = false;
  document.getElementById('mu-senha-wrap').style.display = 'block';
  document.getElementById('mu-dir-wrap').style.display = 'block';
  document.getElementById('mu-title').textContent = 'Novo Usuário';
  document.getElementById('mu-btn').textContent = 'Criar usuário';
  populateDirSelect(null);
  om('modal-usuario');
}
async function editarUsuario(uid) {
  const {data:p} = await SB.from('perfis').select('*').eq('id',uid).single();
  const {data:{user}} = await SB_ADMIN.auth.admin.getUserById(uid);
  document.getElementById('mu-id').value = uid;
  document.getElementById('mu-nome').value = p?.nome||'';
  document.getElementById('mu-area').value = p?.area||'';
  document.getElementById('mu-email').value = user?.email||'';
  document.getElementById('mu-email').disabled = true;
  document.getElementById('mu-senha').value = '';
  document.getElementById('mu-senha-wrap').style.display = 'none';
  document.getElementById('mu-role').value = p?.role||'gestor';
  document.getElementById('mu-dir-wrap').style.display = 'block';
  document.getElementById('mu-title').textContent = 'Editar Usuário';
  document.getElementById('mu-btn').textContent = 'Salvar alterações';
  populateDirSelect(p?.diretoria_id);
  om('modal-usuario');
}
async function salvarUsuario() {
  const uid = document.getElementById('mu-id').value;
  const nome = document.getElementById('mu-nome').value.trim();
  const area = document.getElementById('mu-area').value.trim();
  const email = document.getElementById('mu-email').value.trim();
  const senha = document.getElementById('mu-senha').value.trim();
  const role = document.getElementById('mu-role').value;
  const dirId = document.getElementById('mu-dir').value || null;
  if (!nome || !email) return alert('Preencha nome e e-mail.');
  if (!uid && senha.length < 6) return alert('Senha deve ter ao menos 6 caracteres.');
  const btn = document.getElementById('mu-btn');
  btn.disabled = true; btn.textContent = 'Salvando...';
  if (uid) {
    await SB_ADMIN.from('perfis').update({nome,area,role,diretoria_id:dirId}).eq('id',uid);
    toast('Usuário atualizado!');
  } else {
    const {data,error} = await SB_ADMIN.auth.admin.createUser({
      email, password:senha, email_confirm:true,
      user_metadata:{nome,area,role}
    });
    if (error) { btn.disabled=false; btn.textContent='Criar usuário'; return alert('Erro: '+error.message); }
    await new Promise(function(r){setTimeout(r,1200);});
    await SB_ADMIN.from('perfis').update({nome,area,role,diretoria_id:dirId}).eq('id',data.user.id);
    toast('Usuário criado!');
    const {data:gs} = await SB.from('perfis').select('*').eq('role','gestor').order('nome');
    ST.gestores = gs||[];
    buildGestSidebar();
  }
  btn.disabled = false;
  cm('modal-usuario');
  await vAdminUsers();
}
async function excluirUsuario(uid, nome) {
  if (!confirm('Excluir o usuário "' + nome + '"? Esta ação não pode ser desfeita.')) return;
  await SB_ADMIN.auth.admin.deleteUser(uid);
  toast('Usuário excluído.');
  const {data:gs} = await SB.from('perfis').select('*').eq('role','gestor').order('nome');
  ST.gestores = gs||[];
  buildGestSidebar();
  await vAdminUsers();
}

/* CRUD: DIRETORIAS (Master) */
function novaDiretoria() {
  document.getElementById('md-id').value = '';
  document.getElementById('md-nome').value = '';
  document.getElementById('md-cor').value = '#1E4A5C';
  document.getElementById('md-title').textContent = 'Nova Diretoria';
  document.getElementById('md-btn').textContent = 'Salvar';
  om('modal-diretoria');
}
function editarDiretoria(id) {
  const d = ST.diretorias.find(function(x){return x.id===id;});
  if (!d) return;
  document.getElementById('md-id').value = id;
  document.getElementById('md-nome').value = d.nome;
  document.getElementById('md-cor').value = d.cor;
  document.getElementById('md-title').textContent = 'Editar Diretoria';
  document.getElementById('md-btn').textContent = 'Salvar alterações';
  om('modal-diretoria');
}
async function salvarDiretoria() {
  const id = document.getElementById('md-id').value;
  const nome = document.getElementById('md-nome').value.trim();
  const cor = document.getElementById('md-cor').value;
  if (!nome) return alert('Informe o nome da diretoria.');
  const btn = document.getElementById('md-btn');
  btn.disabled = true;
  if (id) await SB.from('diretorias').update({nome,cor}).eq('id',id);
  else await SB.from('diretorias').insert({nome,cor});
  const {data:dirs} = await SB.from('diretorias').select('*').order('nome');
  ST.diretorias = dirs||[];
  toast('Diretoria salva!');
  btn.disabled = false;
  cm('modal-diretoria');
  buildSidebar();
  await vAdminDirs();
}
async function excluirDiretoria(id, nome) {
  if (!confirm('Excluir a diretoria "' + nome + '"? Os gestores vinculados ficarão sem diretoria.')) return;
  await SB.from('diretorias').delete().eq('id',id);
  const {data:dirs} = await SB.from('diretorias').select('*').order('nome');
  ST.diretorias = dirs||[];
  buildSidebar();
  toast('Diretoria excluída.');
  await vAdminDirs();
}

document.querySelectorAll('.modal-bg').forEach(function(bg) {
  bg.addEventListener('click', function(e){ if(e.target===bg) bg.classList.add('hide'); });
});

init();
</script>
